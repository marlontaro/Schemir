name: Release

# Al crear un tag `vX.Y.Z` compila los instaladores de los tres sistemas y los
# publica en un borrador de Release. También se puede lanzar a mano
# (workflow_dispatch) para SOLO comprobar que el empaquetado funciona, sin publicar.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  bundle:
    name: Instalador (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dependencias de Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            build-essential curl wget file libssl-dev
      - name: Instalar la CLI de Tauri
        run: npm ci
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Compilar y empaquetar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # En un tag crea el Release (borrador); a mano solo compila, sin publicar.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('DataDiff {0}', github.ref_name) || '' }}
          releaseBody: "Instaladores de DataDiff. Descarga el de tu sistema (macOS `.dmg`, Windows `.msi`, Linux `.AppImage`/`.deb`)."
          releaseDraft: true
          prerelease: false
